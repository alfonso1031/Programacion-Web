<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FORMULARIOS REFUERZO</title>
    <link rel="stylesheet" href="../bootstrap-5.3.5-dist/css/bootstrap.min.css">
</head>

<body>
    <form action="server.html" method="get">
        <div>
            <h1 class="text-center">Formulario de Registro</h1>
        </div>
        <div class="container text-center">
            <div class="row align-items-center">
                <div class="col-6-sm-6">
                    <div class="card">
                        <div class="card-header bg-primary text-white">
                            Datos del padre
                        </div>
                        <div class="card-body">
                            <div class="input-group mb-3">
                                <span class="input-group-text" id="basic-addon1">Nombre</span>
                                <input type="text" class="form-control" placeholder="Ingrese el nombre"
                                    aria-label="Username" aria-describedby="basic-addon1" name="nombre" maxlength="10">
                            </div>
                            <div class="input-group mb-3">
                                <span class="input-group-text" id="basic-addon1">Apellido</span>
                                <input type="text" class="form-control" placeholder="Ingrese el apellido"
                                    aria-label="Username" aria-describedby="basic-addon1" name="apellido"
                                    maxlength="10">
                            </div>

                            <div class="input-group mb-3">
                                <input type="text" class="form-control" placeholder="Ingrese su correo"
                                    aria-label="Recipient’s username" aria-describedby="basic-addon2" name="correo">
                                <span class="input-group-text" id="basic-addon2">@gmail.com</span>
                            </div>
                            <div class="input-group mb-3">
                                <span class="input-group-text">Estatura</span>
                                <input type="number" min="1.3" max="2.1" step="0.1" class="form-control"
                                    aria-label="Amount">
                                <span class="input-group-text">metros</span>
                            </div>

                            <div class="input-group mb-3">
                                <span class="input-group-text" id="basic-addon1">Fecha de nacimiento</span>
                                <input type="date" class="form-control" placeholder="Ingrese la fecha de nacimiento"
                                    aria-label="Username" aria-describedby="basic-addon1" name="fecha_nacimiento"
                                    min="1965-01-01" max="2007-12-31">
                            </div>



                            <div class="col-md-6">
                                <label for="validationDefault03" class="form-label">City</label>
                                <input type="text" class="form-control" id="validationDefault03" required>
                            </div>
                            <div class="col-md-3">
                                <label for="validationDefault04" class="form-label">State</label>
                                <select class="form-select" id="validationDefault04" required>
                                    <option selected disabled value="">Choose...</option>
                                    <option>...</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label for="validationDefault05" class="form-label">Zip</label>
                                <input type="text" class="form-control" id="validationDefault05" required>
                            </div>
                            <div class="col-12">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" value="" id="invalidCheck2"
                                        required>
                                    <label class="form-check-label" for="invalidCheck2">
                                        Agree to terms and conditions
                                    </label>
                                </div>
                            </div>
                        </div>
                            <div class="col-12">
                                <button class="btn btn-primary" type="submit">Submit form</button>
                            </div>


                        </div>
                    </div>
                
                <div class="col-6-sm-6">
                        <div class="card">
                        <div class="card-header bg-warning text-white">
                            Datos de la madre
                        </div>
                        <div class="card-body">
                            <div class="input-group mb-3">
                                <span class="input-group-text" id="basic-addon1">Nombre</span>
                                <input type="text" class="form-control" placeholder="Ingrese el nombre"
                                    aria-label="Username" aria-describedby="basic-addon1" name="nombre" maxlength="10">
                            </div>
                            <div class="input-group mb-3">
                                <span class="input-group-text" id="basic-addon1">Apellido</span>
                                <input type="text" class="form-control" placeholder="Ingrese el apellido"
                                    aria-label="Username" aria-describedby="basic-addon1" name="apellido"
                                    maxlength="10">
                            </div>

                            <div class="input-group mb-3">
                                <input type="text" class="form-control" placeholder="Ingrese su correo"
                                    aria-label="Recipient’s username" aria-describedby="basic-addon2" name="correo">
                                <span class="input-group-text" id="basic-addon2">@gmail.com</span>
                            </div>
                            <div class="input-group mb-3">
                                <span class="input-group-text">Estatura</span>
                                <input type="number" min="1.3" max="2.1" step="0.1" class="form-control"
                                    aria-label="Amount">
                                <span class="input-group-text">metros</span>
                            </div>

                            <div class="input-group mb-3">
                                <span class="input-group-text" id="basic-addon1">Fecha de nacimiento</span>
                                <input type="date" class="form-control" placeholder="Ingrese la fecha de nacimiento"
                                    aria-label="Username" aria-describedby="basic-addon1" name="fecha_nacimiento"
                                    min="1965-01-01" max="2007-12-31">
                            </div>



                            <div class="col-md-6">
                                <label for="validationDefault03" class="form-label">City</label>
                                <input type="text" class="form-control" id="validationDefault03" required>
                            </div>
                            <div class="col-md-3">
                                <label for="validationDefault04" class="form-label">State</label>
                                <select class="form-select" id="validationDefault04" required>
                                    <option selected disabled value="">Choose...</option>
                                    <option>...</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label for="validationDefault05" class="form-label">Zip</label>
                                <input type="text" class="form-control" id="validationDefault05" required>
                            </div>
                            <div class="col-12">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" value="" id="invalidCheck2"
                                        required>
                                    <label class="form-check-label" for="invalidCheck2">
                                        Agree to terms and conditions
                                    </label>
                                </div>
                            </div>
                        </div>
                            <div class="col-6">
                                <button class="btn btn-primary" type="submit">Submit form</button>
                            </div>


                        </div>
                    </div>
                </div>
                </div>
                </div>
            </div>
        </div>
    </form>

    <script src="../bootstrap-5.3.5-dist/js/bootstrap.min.js"></script>
</body>

</html>
