<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="./public/bootstrap-5.3.5-dist/bootstrap-5.3.5-dist/css/bootstrap.min.css">
  <title>Gustos Personales – Alfonso Arroyo</title>
</head>
<body>
  <!-- Header similar al index -->
  <header class="bg-primary text-light py-3">
    <div class="container d-flex justify-content-between align-items-center">
      <h3>Alfonso Arroyo</h3>
      <nav>
        <ul class="nav">
          <li class="nav-item"><a class="nav-link text-light" href="index.html#home">Inicio</a></li>
          <li class="nav-item"><a class="nav-link text-light" href="index.html#about">Sobre mí</a></li>
          <li class="nav-item"><a class="nav-link text-light" href="index.html#projects">Proyectos</a></li>
          <li class="nav-item"><a class="nav-link text-light" href="index.html#skills">Habilidades</a></li>
          <li class="nav-item"><a class="nav-link text-light" href="gustos-personales.html">Gustos Personales</a></li>
          <li class="nav-item"><a class="nav-link text-light" href="index.html#contact">Contacto</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="py-5">
    <section id="gustos-personales" class="container">
      <!-- Nuevo título dentro de header -->
      <h2 class="text-center mb-4">Gustos Personales</h2>

      <!-- Música -->
      <div id="music" class="bg-light py-4 rounded">
        <h3 class="text-center mb-3">Mi Música Favorita</h3>
        <div class="row g-4">
          <div class="col-md-4">
            <div class="card h-100">
              <img src="./public/img/music1.jpg" class="card-img-top" alt="Drama - C.Tangana" loading="lazy">
              <div class="card-body text-center">
                <h5 class="card-title">Drama – C.Tangana</h5>
                <audio controls class="w-100">
                  <source src="./public/audio/Drama.mp3" type="audio/mpeg">
                  Tu navegador no soporta audio.
                </audio>
              </div>
            </div>
          </div>
          <div class="col-md-4">
            <div class="card h-100">
              <img src="./public/img/music2.webp" class="card-img-top" alt="Wildflower – Billie Eilish" loading="lazy">
              <div class="card-body text-center">
                <h5 class="card-title">Wildflower – Billie Eilish</h5>
                <audio controls class="w-100">
                  <source src="./public/audio/wildflower.mp3" type="audio/mpeg">
                  Tu navegador no soporta audio.
                </audio>
              </div>
            </div>
          </div>
          <div class="col-md-4">
            <div class="card h-100">
              <img src="./public/img/music3.jpeg" class="card-img-top" alt="Heavydirtysoul – Twenty One Pilots" loading="lazy">
              <div class="card-body text-center">
                <h5 class="card-title">Heavydirtysoul – Twenty One Pilots</h5>
                <audio controls class="w-100">
                  <source src="./public/audio/top.mp3" type="audio/mpeg">
                  Tu navegador no soporta audio.
                </audio>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Video -->
      <div id="demo-video" class="container py-5">
        <h3 class="text-center mb-3">Video Favorito</h3>
        <div class="d-flex justify-content-center">
          <video width="640" height="360" autoplay loop muted loading="lazy">
            <source src="./public/video/codingVideo.mp4" type="video/mp4">
            Tu navegador no soporta vídeo.
          </video>
        </div>
      </div>

      <!-- Botón para regresar al index -->
      <div class="text-center mt-4">
        <a href="index.html" class="btn btn-secondary">← Volver al Inicio</a>
      </div>

    </section>
  </main>

  <script src="./public/bootstrap-5.3.5-dist/bootstrap-5.3.5-dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
