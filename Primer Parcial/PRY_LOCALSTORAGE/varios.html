<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Varios Elementos</title>
    <link rel="stylesheet" href="../bootstrap-5.3.5-dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container py-5">
        <h1>Crear Usuario con varios datos</h1>
        <br>
        <label for="nombre">Ingrese su nombre</label>
        <input type="text" id="nombre" name="nombre" placeholder="Ingrese su nombre" class="form-control">
        <br>
        <label for="apellido">Ingrese su apellido</label>
        <input type="text" id="apellido" name="apellido" placeholder="Ingrese su apellido" class="form-control">
        <br>
        <label for="email">Ingrese su email</label>
        <input type="email" id="email" name="email" placeholder="Ingrese su email" class="form-control">
        <br>
        <button class="btn btn-primary" onclick="guardarDatosUsuarios()">Guardar</button>
        <a href="index.html" class="btn btn-danger">Cancelar</a>
    </div>
    
    <script src="../bootstrap-5.3.5-dist/js/bootstrap.min.js"></script>
    <script src="./public/js/guardar_usuarios_varios.js"></script>
</body>
</html>
