<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CALCULADORA BASICA CON JS</title>
    <link rel="stylesheet" href="../bootstrap-5.3.5-dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="public/css/calculadora.css">
</head>

<body>
    <div class="container mt-5">
        <h1 class="text-center mb-4 text-primary">CALCULADORA BASICA CON JS</h1>
        <div class="card p-4 mx-auto" style="max-width: 350px; width: 100%;">
            <input type="number" class="form-control my-2 text-end" disabled value="0" id="pantalla">
            <div class="row g-2 p-2">
                <div class="col-6 col-sm-3">
                    <button class="btn btn-secondary w-100" onclick="agregarNumero(7)">7</button>
                </div>
                <div class="col-6 col-sm-3">
                    <button class="btn btn-secondary w-100" onclick="agregarNumero(8)">8</button>
                </div>
                <div class="col-6 col-sm-3">
                    <button class="btn btn-secondary w-100" onclick="agregarNumero(9)">9</button>
                </div>
                <div class="col-6 col-sm-3">
                    <button class="btn btn-warning w-100" onclick="agregarOperacion('+')">+</button>
                </div>
            </div>
            <div class="row g-2 p-2">
                <div class="col-6 col-sm-3">
                    <button class="btn btn-secondary w-100" onclick="agregarNumero(4)">4</button>
                </div>
                <div class="col-6 col-sm-3">
                    <button class="btn btn-secondary w-100" onclick="agregarNumero(5)">5</button>
                </div>
                <div class="col-6 col-sm-3">
                    <button class="btn btn-secondary w-100" onclick="agregarNumero(6)">6</button>
                </div>
                <div class="col-6 col-sm-3">
                    <button class="btn btn-warning w-100" onclick="agregarOperacion('-')">-</button>
                </div>
            </div>
            <div class="row g-2 p-2">
                <div class="col-6 col-sm-3">
                    <button class="btn btn-secondary w-100" onclick="agregarNumero(1)">1</button>
                </div>
                <div class="col-6 col-sm-3">
                    <button class="btn btn-secondary w-100" onclick="agregarNumero(2)">2</button>
                </div>
                <div class="col-6 col-sm-3">
                    <button class="btn btn-secondary w-100" onclick="agregarNumero(3)">3</button>
                </div>
                <div class="col-6 col-sm-3">
                    <button class="btn btn-warning w-100" onclick="agregarOperacion('*')">*</button>
                </div>
            </div>
            <div class="row g-2 p-2">
                <div class="col-6 col-sm-3">
                    <button class="btn btn-danger w-100" onclick="limpiarPantalla()">C</button>
                </div>
                <div class="col-6 col-sm-3">
                    <button class="btn btn-secondary w-100" onclick="agregarNumero(0)">0</button>
                </div>
                <div class="col-6 col-sm-3">
                    <button class="btn btn-success w-100" onclick="calcularResultado()">=</button>
                </div>
                <div class="col-6 col-sm-3">
                    <button class="btn btn-warning w-100" onclick="agregarOperacion('/')">/</button>
                </div>
            </div>
        </div>
    </div>

    <script src="./public/js/calculadora.js"></script>
    <script src="../bootstrap-5.3.5-dist/js/bootstrap.min.js"></script>
</body>

</html>
