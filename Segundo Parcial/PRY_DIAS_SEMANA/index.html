<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIAS DE LA SEMANA</title>
    <link rel="stylesheet" href="../bootstrap-5.3.5-dist/css/bootstrap.min.css">
</head>
<body>
    <h1 class="text-center"> DIAS DE LA SEMANA</h1>
    <div class="mb-3">
        <label for="dias_semana" class="form-label">SELECCIONE UN DIA</label>
        <select
            class="form-select form-select-lg"
            name="dias_semana"
            id="dias_semana"
            onchange="seleccionarDia(this)"
            >
            <option selected>Seleccione un dia</option>
            <option value="lunes">Lunes</option>
            <option value="Martes">Martes</option>
            <option value="Miercoles">Miercoles</option>
            <option value="Jueves">Jueves</option>
            <option value="Viernes">Viernes</option>
            <option value="Sabado">Sabado</option>
            <option value="Domingo">Domingo</option>
        </select>
    </div>
    <h4 class="text-success fw-bold" id="dia_seleccionado"></h4>

    <script src="./public/js/dias_semana.js"></script>
    <script src="../bootstrap-5.3.5-dist/js/bootstrap.min.js"></script>
</body>
</html>
