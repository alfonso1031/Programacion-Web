<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selector mediantes clase (.)</title>
    <style>
        .importante{
            color: red;
            text-align: center;
        }
        .destacado{
            color: blue;
            font-weight: bold;
            font-size: 1.2em;
            background-color: yellow;
        }   
        body {
            background-color: #f0f0f0;
            color: #333;
            font-family: Arial, sans-serif;
        }
    </style>
</head>
<body>
    <h1 class="importante">Hola mundo</h1>
    <p class="destacado">Este parrafo es importante y destacado</p>
</body>
</html>
