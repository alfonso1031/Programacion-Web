<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selector clase 2</title>
    <link rel="stylesheet" href="./public/page_selector2.css">
</head>
<body>
    <h1 class="titulo">Selector por clase</h1>
    <p class="importante">Este párrafo es importante</p>
    <p class="destacado">Este párrafo es destacado</p>
    <p class="importante destacado">Este párrafo es importante y destacado</p>
    <table class="tabla1">
        <tr class="fila1">
            <th>Nombre</th>
            <th>Edad</th>
            <th>Ciudad</th>
        </tr>
        <tr class="fila2">
            <td>Ana</td>
            <td>30</td>
            <td>Quito</td>
        </tr>
        <tr class="fila3">
            <td>Carlos</td>
            <td>25</td>
            <td>Guayaquil</td>
        </tr>
    </table>
    <button class="boton_guardar">
        Guardar
    </button>
    <form class="formulario1">
        <label class="label1 importante destacado">Nombre:</label>
        <input type="text" class="input1" placeholder="Ingrese su nombre: ">
    </form>
</body>
</html>
